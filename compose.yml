services:
  db:
    image: docker.io/library/postgres:${POSTGRES_VERSION:-16}
    container_name: ${DB_CONTAINER_NAME:-tabletop-gaming-club-db}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tgc-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tgc-pass}
      POSTGRES_DB: ${POSTGRES_DB:-tgc-db}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
